# V-JEPA world model, FD-loss fine-tune (arXiv:2604.28190v1) on top of the real step-1999
# checkpoint from wm_first_run_vjepa.yaml. Same architecture-relevant settings as that recipe
# (height/width/frames/compile/num_workers unchanged -- must match, since --resume loads into
# the same model shape); only the training-dynamics fields differ.
#
# steps: 2500 -- checkpoint step 1999 -> start_step 2000 -> +500 more steps lands on 2499
# inclusive, i.e. --steps 2500 (not 2499).
# lr: 1e-5, an order of magnitude below the base run's 1e-4 -- matches the paper's own
# post-training LR range (1e-6-1e-5), scaled for a much shorter fine-tune.
# fd_loss_weight: 0.002, corrected from an initial 1.0 guess after a real smoke test showed why --
# loss_fd (~100-225, one-step-estimate proxy vs precomputed real stats) totally dominated
# loss_diffusion (~0.3) at weight=1.0: loss_total was ~99.8% FD-loss, loss_diffusion trended UP
# over 10 steps, and frechet_dino_distance/frechet_inception_distance got WORSE (32.71->42.19,
# 101.90->145.51) despite psnr/ssim ticking up. 0.002 brings fd_loss_weight*loss_fd down to
# roughly loss_diffusion's own scale. Re-validated with a real 10-step smoke test at the correct
# batch/grad_accum below: frechet_dino_distance IMPROVED 32.71->23.42, psnr/ssim/lpips all
# improved too, loss_diffusion stayed in a tight band instead of trending up. Confirmed good.
# fd_loss_ema_decay: 0.97, deliberately far below the paper's own 0.999 (tuned for thousands of
# post-training steps -- at 500 it would barely move from its seed).

precision: bf16
height: 448
width: 768
frames: 40
# lr must be written 1.0e-5, not 1e-5 -- PyYAML's default float regex requires a decimal point for
# scientific notation, otherwise this silently parses as the STRING "1e-5", not a float (real,
# hit-for-real: crashed deep inside torch.optim.AdamW's own `lr >= 0` check, not here).
# batch_size/grad_accum_steps: real, confirmed on the actual GPU -- 4/4 (matching the base run's
# own config) OOMs even with per-block decoder checkpointing on FD-loss's decode+dino_forward
# pass; 2/8 (same effective batch 16) fits, cuda_peak_reserved=29.64GiB of 44.42GiB.
batch_size: 2
grad_accum_steps: 8
steps: 2500
lr: 1.0e-5
compile: true
num_workers: 6
scheduled_sampling_prob: 0.3
fd_loss_weight: 0.002
fd_loss_ema_decay: 0.97
drift_eval_context_latents: 2
fdd_slice_frames: 6
drift_eval_n_samples: 12
viz_n_samples: 10
