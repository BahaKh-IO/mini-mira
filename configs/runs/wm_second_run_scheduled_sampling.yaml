# Second real world-model run: resumes the first run's checkpoint with scheduled sampling on,
# to test whether it narrows the rollout-depth quality degradation the first run found. Real
# config, not synthetic -- see notes/session_handoff.md section 5.
#
#   python scripts/train_world_model.py --config configs/scaled_300m.yaml \
#     --run-config configs/runs/wm_second_run_scheduled_sampling.yaml \
#     --index-path <train data dir> --test-index-path <held-out dir> \
#     --codec-checkpoint ~/mini_mira/checkpoints/checkpoint.pth \
#     --latent-stats ~/mini_mira/latent_stats.json \
#     --require-pretrained-dino --resume

precision: bf16
batch_size: 4
grad_accum_steps: 4
steps: 5500

scheduled_sampling_prob: 0.3

drift_eval_context_latents: 2
fdd_slice_frames: 6
drift_eval_n_samples: 12
viz_n_samples: 10
