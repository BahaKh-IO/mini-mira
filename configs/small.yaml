# small.yaml -- mirrors mini_mira's built-in dataclass defaults exactly (PipelineConfig()).
# Regression-safe baseline preset. Measured total parameters: 11,320,960.

bottleneck:
  dino_dim: 768        # dinov3_vitb16's feature width -- the real variant this project loads
  latent_dim: 32
  stride: 2
  temporal_stride: 2

world_model:
  latent_dim: 32
  hidden_dim: 256
  depth: 4
  num_heads: 8
  mlp_dim_multiplier: 4
  eps: 1.0e-6              # decimal point required -- PyYAML parses bare "1e-6" as a string
  layerscale_init: 1.0e-4
  rope_theta_spatial: 100.0
  rope_theta_temporal: 64.0

decoder:
  latent_dim: 32
  stride: 2
  width: 256
  depth: 4
  num_heads: 8
  mlp_dim_multiplier: 4
  causal: true
  out_channels: 3
  patch_size: 16
  patch_size_t: 2
  eps: 1.0e-6
  layerscale_init: 1.0e-4
  rope_theta_spatial: 100.0
  rope_theta_temporal: 64.0

n_diffusion_steps: 4
num_keys: 9   # the real Rocket League release vocabulary size (W,A,S,D,Q,E,Space,LShift,LCtrl)
